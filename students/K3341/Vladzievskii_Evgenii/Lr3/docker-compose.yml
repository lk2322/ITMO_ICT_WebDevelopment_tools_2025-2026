version: "3.8"

services:
  # ---- PostgreSQL ----
  db:
    image: postgres:16-alpine
    container_name: finance-postgres
    environment:
      POSTGRES_USER: finance
      POSTGRES_PASSWORD: finance123
      POSTGRES_DB: finance_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finance -d finance_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finance-net

  # ---- Redis (брокер Celery) ----
  redis:
    image: redis:7-alpine
    container_name: finance-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - finance-net

  # ---- FastAPI основное приложение ----
  api:
    build: .
    container_name: finance-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://finance:finance123@db:5432/finance_db
      SECRET_KEY: your-secret-key-change-in-production
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      PARSER_URL: http://parser:8001
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - finance-net
    restart: unless-stopped

  # ---- FastAPI парсер ----
  parser:
    build:
      context: .
      dockerfile: parser/Dockerfile
    container_name: finance-parser
    ports:
      - "8001:8001"
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - finance-net
    restart: unless-stopped

  # ---- Celery Worker ----
  celery-worker:
    build: .
    container_name: finance-celery-worker
    command: >
      celery -A celery_app.celery_app worker
      --loglevel=info
      --concurrency=4
      -Q celery
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - finance-net
    restart: unless-stopped

  # ---- Celery Beat (периодические задачи) ----
  celery-beat:
    build: .
    container_name: finance-celery-beat
    command: celery -A celery_app.celery_app beat --loglevel=info
    environment:
      REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - finance-net
    restart: unless-stopped

volumes:
  postgres_data:

networks:
  finance-net:
    driver: bridge
