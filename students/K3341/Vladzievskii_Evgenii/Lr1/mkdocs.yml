site_name: Personal Finance Management API
site_description: Лабораторная работа 1 — FastAPI серверное приложение для управления личными финансами
site_author: Владзиевский Евгений (K3341)
theme:
  name: material
  language: ru
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - toc.follow

nav:
  - Главная: index.md
  - Модель данных: data-model.md
  - API эндпоинты: api-endpoints.md
  - Аутентификация: authentication.md
  - Установка и запуск: setup.md
  - Тестирование: testing.md

markdown_extensions:
  - admonition
  - codehilite
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
